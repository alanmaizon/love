# Guestbook E2E (Playwright). CI runs the DECOUPLED test: it asserts the backend
# creates a valid Stripe Checkout Session, confirms the donation via the real
# webhook code path (DEBUG + E2E_TEST_HOOKS), then drives the browser through
# guestbook → approve → public. The full live Stripe-hosted Checkout UI walk
# (@live) is excluded from CI (Stripe blocks headless traffic); run it locally
# with `npm run e2e:live`.
#
# Repository SECRETS (not variables):
#   STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY  — required
#   E2E_STRIPE_ACCOUNT_ID, E2E_HOST_PASSWORD    — optional (e2e_prepare can discover acct_)
#
# VITE_API_URL is NOT a secret — Playwright sets it when starting Vite:
#   VITE_API_URL=http://localhost:5173 npm run dev

name: e2e-guestbook

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: love_backend/requirements.txt

      - name: Install backend deps
        working-directory: love_backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Write backend .env for E2E
        working-directory: love_backend
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          E2E_STRIPE_ACCOUNT_ID: ${{ secrets.E2E_STRIPE_ACCOUNT_ID }}
          E2E_HOST_PASSWORD: ${{ secrets.E2E_HOST_PASSWORD }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "Missing STRIPE_SECRET_KEY or STRIPE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          cat > .env <<EOF
          SECRET_KEY=ci-e2e-secret-key
          DEBUG=True
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
          E2E_STRIPE_ACCOUNT_ID=${E2E_STRIPE_ACCOUNT_ID}
          E2E_HOST_PASSWORD=${E2E_HOST_PASSWORD}
          CSRF_TRUSTED_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
          CORS_ALLOWED_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
          FRONTEND_URL=http://localhost:5173
          E2E_TEST_HOOKS=True
          EOF

      - name: Install frontend deps
        working-directory: love_frontend
        run: npm ci

      - name: Install Playwright (Chromium + OS deps)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run guestbook E2E
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
